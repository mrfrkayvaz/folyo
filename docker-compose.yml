name: folyo

# ─────────────────────────────────────────────────────────────────────────────
# Folyo — canlı geliştirme stack'i (brüv modeli)
# Tüm servisler kaynak kodları bind-mount eder ve dev sunucusu olarak çalışır:
#   · web      → Vite dev server + HMR (kod kaydet → tarayıcı anında yansır)
#   · web-api  → uvicorn --reload (kod kaydet → otomatik restart)
# Statik prod build / volume dansı yoktur.
#
# Kullanım:
#   docker compose up -d --build
#     → http://localhost:5173  (Vite HMR, /api → vite proxy → web-api)
#     → http://localhost:8080  (Caddy: aynı arayüz, üstten)
#   Yeni npm paketi:  docker compose up -d --build web
#   Yeni pip paketi:  docker compose build web-api
#   .env değişince:   docker compose up -d --force-recreate web-api
# ─────────────────────────────────────────────────────────────────────────────

services:
  db:
    image: postgres:16-alpine
    container_name: folyo-db
    environment:
      POSTGRES_USER: folyo
      POSTGRES_PASSWORD: folyo
      POSTGRES_DB: folyo
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U folyo -d folyo"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # Redis — ARQ iş kuyruğu (embed/enrich görev üretimi)
  redis:
    image: redis:7-alpine
    container_name: folyo-redis
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  # Embed worker: ARQ tüketicisi — web-api'nin ürettiği embed/enrich işlerini işler.
  # Aynı web-api imajı + ayrı süreç (arbe suarı event loop'tan bağımsız).
  web-worker:
    build: ./web-api
    container_name: folyo-worker
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - path: ./web-api/.env
        required: false
    environment:
      DATABASE_URL: postgresql+asyncpg://folyo:folyo@db:5432/folyo
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ./web-api/app:/app/app
      - ./web-api/chroma_data:/app/chroma_data
      - ./web-api/storage:/app/storage
    command: ["uv", "run", "--no-sync", "arq", "app.worker_settings.settings"]
    restart: unless-stopped

  # Backend: kaynak bind-mount + uvicorn --reload → .py kaydet, anında restart
  web-api:
    build: ./web-api
    container_name: folyo-api
    ports:
      - "8000:8000"          # doğrudan erişim (debug için)
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - path: ./web-api/.env  # API anahtarların (yoksa compose hatasız çalışır)
        required: false
    environment:
      # container içi: localhost DEĞİL db servisi (host'taki api localhost kullanır)
      DATABASE_URL: postgresql+asyncpg://folyo:folyo@db:5432/folyo
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ./web-api/app:/app/app        # canlı kod
      - ./web-api/chroma_data:/app/chroma_data  # vektör verisi host'ta kalsın
      - ./web-api/storage:/app/storage          # yüklenen belgeler host'ta kalsın
    command: ["uv", "run", "--no-sync", "uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    restart: unless-stopped

  # Frontend: Vite dev server — kaynak bind-mount, HMR anında yansır
  web:
    build:
      context: ./web
      dockerfile: Dockerfile.dev
    container_name: folyo-web
    ports:
      - "5173:5173"
    environment:
      VITE_API_PROXY: http://web-api:8000   # vite proxy hedefi (container içi)
    volumes:
      - ./web/src:/app/src
      - ./web/public:/app/public
      - ./web/index.html:/app/index.html
      - ./web/vite.config.js:/app/vite.config.js
    depends_on:
      - web-api
    restart: unless-stopped

  # ── Panel (yönetim görünümü) — aynı DB + Chroma'yı okur; şemayı web-api yönetir ──
  panel-api:
    build: ./panel-api
    container_name: folyo-panel-api
    ports:
      - "8001:8000"
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - path: ./panel-api/.env
        required: false
    environment:
      DATABASE_URL: postgresql+asyncpg://folyo:folyo@db:5432/folyo
      CHROMA_DIR: /app/chroma_data
    volumes:
      - ./panel-api/app:/app/app
      - ./web-api/chroma_data:/app/chroma_data
    command: ["uv", "run", "--no-sync", "uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    restart: unless-stopped

  panel:
    build:
      context: ./panel
      dockerfile: Dockerfile.dev
    container_name: folyo-panel
    ports:
      - "5174:5174"
    environment:
      VITE_API_PROXY: http://panel-api:8000
    volumes:
      - ./panel/src:/app/src
      - ./panel/public:/app/public
      - ./panel/index.html:/app/index.html
      - ./panel/vite.config.js:/app/vite.config.js
    depends_on:
      - panel-api
    restart: unless-stopped

  # Ters proxy (opsiyonel): :8080'den aynı arayüze — /api doğrudan backend'e
  caddy:
    image: caddy:2-alpine
    container_name: folyo-caddy
    ports:
      - "8080:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      - web
    restart: unless-stopped

volumes:
  pgdata:
