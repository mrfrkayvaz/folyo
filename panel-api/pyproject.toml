[project]
name = "panel-api"
version = "0.1.0"
description = "Folyo Panel API — yönetim + şema/migrasyon/kullanıcı sahibi"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.13.0",
    "asyncpg>=0.31.0",
    "bcrypt>=4.0.0",
    "chromadb==1.5.9",
    "fastapi>=0.141.1",
    "pydantic-settings>=2.15.0",
    "sqlalchemy>=2.0.0",
    "sqlmodel>=0.0.42",
    "uvicorn[standard]>=0.52.4",
]
[dependency-groups]
dev = ["pytest>=8.0"]
