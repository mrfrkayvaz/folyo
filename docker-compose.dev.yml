# Geliştirme override'ı — SADECE local dev için
#
# Backend'i container'da çalıştırmak istersen (host'a Python bağımlılığı kurmak
# istemezsen) bu override kaynak kodu bind-mount eder ve uvicorn'u --reload ile
# başlatır: web-api/app/ altındaki her kaydetmede container otomatik restart olur.
#
# Frontend'i her zaman host'ta çalıştırın (HMR için):
#   cd web && npm run dev          → http://localhost:5173  (/api → localhost:8000 proxy)
#
# Kullanım (production servislerini başlatmadan sadece API'yi ayağa kaldırır):
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up web-api
#
# Ya da scripts/dev.sh kullanıyorsan bu dosyaya GEREK YOK — ikisi de host'ta çalışır.

services:
  web-api:
    command: uv run --no-sync uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./web-api:/app
      # İmajdaki derlenmiş .venv'i koru (bind-mount üzerine gelmesin)
      - web-api-venv:/app/.venv

volumes:
  web-api-venv:
